name: Unzip site
on:
  push:
    paths:
      - '.github/workflows/unzip.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site files
        run: |
          unzip -o nusuk-key-codes-deploy.zip
          ls -l
      - name: Commit extracted index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f nusuk-key-codes-deploy.zip
          git add -A
          git status
          git commit -m "Extract index.html from deployment ZIP" || echo "nothing to commit"
          git push
